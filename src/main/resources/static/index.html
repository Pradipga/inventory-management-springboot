<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }


        .header {
            background: #1f2937;
            color: white;
            padding: 25px 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }


        .logout-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(220, 38, 38, 0.18);
            transition: background 0.2s ease, transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .logout-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(220, 38, 38, 0.25);
        }


        .logout-btn:hover {
            background: #b91c1c;
        }


        .header h1 {
            font-size: 30px;
        }

        .header p {
            margin-top: 8px;
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }


        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 22px 25px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .top-bar h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }



        .add-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
            transition: background 0.2s ease, transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .add-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }


        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            align-items: stretch;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 30px 0;
            padding: 16px;
        }

        .pagination button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .pagination button:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        #pageInfo {
            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }


        .product-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            border: 1px solid #e2e8f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
            box-sizing: border-box;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
        }


        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
            padding: 10px;
            box-sizing: border-box;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            cursor: zoom-in;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.10);

        }


        .product-card img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
        }



        .product-card h3 {
            font-size: 21px;
            margin: 0 0 16px 0;
            color: #0f172a;
            font-weight: 700;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .product-card p {
            margin: 8px 0 12px;
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }


        .price {
            font-weight: bold;
            color: #16a34a;
            font-size: 18px;
            margin-top: 14px;
        }

        .quantity {
            font-weight: bold;
            color: #2563eb;
            font-size: 16px;
        }

        .stock-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #f3f4f6;
        }
        .category-badge {
            display: inline-block;
            padding: 5px 10px;
            margin-left: 5px;
            border-radius: 15px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: bold;
        }


        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: stretch;
        }

        .actions button {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .actions button:hover {
            transform: translateY(-2px);
        }


        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .edit-btn:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }
        .product-form {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .product-form h2 {
            margin-bottom: 20px;
        }


        .product-form input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .product-form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        .save-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }
        /* Edit Product Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }


        .modal-content {
            background: #ffffff;
            width: min(400px, calc(100% - 24px));
            max-height: 90vh;
            overflow-y: auto;
            margin: 5vh auto;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }


        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }


        .modal-content input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .modal-content input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }



        .save-btn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(22, 163, 74, 0.18);
            transition: background 0.2s ease, transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .save-btn:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(22, 163, 74, 0.25);
        }



        .cancel-btn {
            margin-top: 20px;
            margin-left: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #64748b;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(100, 116, 139, 0.15);
            transition: background 0.2s ease, transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .cancel-btn:hover {
            background: #475569;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(100, 116, 139, 0.22);
        }


        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #218838;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }
        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: 0 0 25px 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .search-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        #searchInput {
            flex: 1;
            min-width: 80px;
            border: none;
            outline: none;
            padding: 12px 5px;
            font-size: 16px;
            background: transparent;
        }

        #categoryFilter,
        #sortBy {
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #1e293b;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #categoryFilter:focus,
        #sortBy:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .search-container label {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            white-space: nowrap;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }


        .dashboard-card {
            min-height: 140px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
        }



        .dashboard-card h3 {
            min-height: 24px;
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            white-space: nowrap;
        }

        .dashboard-card p {
            min-height: 36px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1;
        }


        /* ================================
   DASHBOARD ALIGNMENT FIX
   ================================ */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 35px;
            box-sizing: border-box;
        }

        .stat-card {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-card .number {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
            line-height: 1;
        }

        /* Products heading + search + button */
        .products-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
        }


        .products-header h2 {
            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
        }


        .products-header .search-container {
            flex: 1;
            min-width: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .products-header .search-container #searchInput {
            flex: 1 1 150px;
            min-width: 100px;
        }

        .products-header .search-container #categoryFilter,
        .products-header .search-container #sortBy {
            flex-shrink: 1;
        }

        .products-header .add-btn {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .search-box {
            flex: 1;
            max-width: 350px;
        }


        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #1e293b;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* Keep Add Product button aligned */
        .products-header button {
            white-space: nowrap;
        }

        /* Responsive */

        @media (max-width: 900px) {
            .dashboard,
            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .products-header {
                flex-wrap: wrap;
            }
        }



        @media (max-width: 600px) {
            .dashboard,
            .stats {
                grid-template-columns: 1fr;
            }

            .products-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }

            .header {
                padding: 16px;
                text-align: center;
            }

            .top-bar {
                padding: 18px;
            }

            .top-bar h2 {
                font-size: 23px;
            }
            .products {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .product-card {
                padding: 16px;
            }

            .product-card img {
                height: 180px;
                padding: 8px;
                margin-bottom: 14px;
            }
            .actions {
                gap: 10px;
            }

            .actions button {
                padding: 12px 8px;
                font-size: 14px;
                min-height: 44px;
            }
            .dashboard-card {
                min-height: 120px;
                padding: 16px;
            }

            .dashboard-card h3 {
                font-size: 15px;
            }

            .dashboard-card p {
                font-size: 24px;
            }
            .search-container {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .search-container input,
            .search-container select {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                min-height: 44px;
            }
            .pagination {
                gap: 10px;
                padding: 12px 4px;
                flex-wrap: wrap;
            }

            .pagination button {
                padding: 10px 12px;
                min-height: 44px;
                font-size: 13px;
            }

            #pageInfo {
                font-size: 13px;
            }
            .container {
                width: 94%;
                margin: 14px auto;
            }

            .top-bar {
                padding: 14px;
            }

            .products {
                gap: 16px;
            }
            #productForm input,
            #productForm select,
            #productForm textarea,
            #editForm input,
            #editForm select,
            #editForm textarea {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                min-height: 44px;
                font-size: 16px;
            }
            #loginForm input,
            #loginForm button {
                width: 100%;
                box-sizing: border-box;
                min-height: 44px;
                font-size: 16px;
            }

            #loginForm button {
                margin-top: 12px;
            }
            .product-card .actions {
                display: flex;
                flex-direction: row;
                gap: 8px;
            }

            .product-card .actions button {
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere;
            }
            .modal-content {
                width: 92%;
                max-width: 92%;
                max-height: 85vh;
                margin: 5vh auto;
                padding: 16px;
                box-sizing: border-box;
                overflow-y: auto;
            }
            .product-card h3 {
                font-size: 19px;
                line-height: 1.4;
                overflow-wrap: anywhere;
            }

            .product-card p {
                font-size: 14px;
                line-height: 1.6;
                overflow-wrap: anywhere;
            }
        }


    </style>

</head>

<body>


<div class="header">
    <div class="header-top">
        <div>
            <h1>Inventory Management</h1>
            <p>Manage your products easily</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>
</div>

<div class="container">

    <div class="top-bar">
        <div class="dashboard">

            <div class="dashboard-card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Total Stock</h3>
                <p id="totalStock">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Low Stock</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Out of Stock</h3>
                <p id="outOfStock">0</p>
            </div>

        </div>

        <div class="products-header">

            <h2>Products</h2>

            <div class="search-container">
                <span class="search-icon">🔍</span>

                <input
                        type="text"
                        id="searchInput"
                        placeholder="Search products..."
                        onkeyup="searchProducts()"
                >

                <select id="categoryFilter" onchange="filterByCategory()">
                    <option value="all">All Categories</option>
                </select>

                <label for="sortBy">Sort By</label>

                <select id="sortBy" onchange="sortProducts()">
                    <option value="default">Default</option>
                    <option value="nameAsc">Name (A → Z)</option>
                    <option value="nameDesc">Name (Z → A)</option>
                    <option value="priceAsc">Price (Low → High)</option>
                    <option value="priceDesc">Price (High → Low)</option>
                    <option value="quantityAsc">Quantity (Low → High)</option>
                    <option value="quantityDesc">Quantity (High → Low)</option>
                </select>

            </div>

            <button class="add-btn" onclick="showAddForm()">
                + Add Product
            </button>

        </div>
    </div>

    <div id="productForm" class="product-form" style="display: none;">

        <h2>Add New Product</h2>

        <input
                type="text"
                id="name"
                placeholder="Product Name"
        >

        <input
                type="text"
                id="description"
                placeholder="Description"
        >


        <input type="text" id="productCategory" placeholder="Enter category">

        <input
                type="number"
                id="price"
                placeholder="Price"
        >



        <input
                type="number"
                id="quantity"
                placeholder="Quantity"
        >
        <label>Product Image</label>
        <input type="file" id="productImage" accept="image/jpeg,image/png,image/webp,image/gif">

        <button class="save-btn" onclick="saveProduct()">
            Save Product
        </button>

        <button class="cancel-btn" onclick="hideAddForm()">
            Cancel
        </button>

    </div>

    <div id="products" class="products">
        Loading products...
    </div>
    <div id="pagination" class="pagination">
        <button id="prevPage" onclick="previousPage()">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextPage" onclick="nextPage()">Next</button>
    </div>

</div>

<!-- Edit Product Modal -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeEditModal()">&times;</span>

        <h2>Edit Product</h2>

        <form id="editForm" onsubmit="event.preventDefault(); updateProduct();">

            <input type="hidden" id="editId">

            <label>Product Name</label>
            <input type="text" id="editName" >

            <label>Description</label>
            <input type="text" id="editDescription" >

            <label>Category</label>
            <input type="text" id="editCategory" placeholder="Enter category">


            <label>Price</label>
            <input type="number" id="editPrice" >

            <label>Quantity</label>
            <input type="number" id="editQuantity" >


            <label>Product Image</label>
            <input
                    type="file"
                    id="editProductImage"
                    accept="image/jpeg,image/png,image/webp,image/gif">

            <button type="submit" class="save-btn">
                Update Product
            </button>

            <button type="button" class="cancel-btn" onclick="cancelEdit()">Cancel</button>

        </form>

    </div>

</div>
<script>
    let currentPage = 1;
    const productsPerPage = 5;
    let allProducts = [];
    let filteredProducts = [];


    function loadProducts() {

        fetch('/api/products')
            .then(response => response.json())
            .then(products => {
                allProducts = products;
                filteredProducts = products;
                currentPage = 1;

                let totalProducts = products.length;
                let totalStock = 0;
                let lowStock = 0;
                let outOfStock = 0;

                const categories = new Set();

                products.forEach(product => {
                    totalStock += product.quantity;

                    if (product.quantity === 0) {
                        outOfStock++;
                    } else if (product.quantity <= 5) {
                        lowStock++;
                    }

                    if (product.category) {
                        categories.add(product.category);
                    }
                });

                document.getElementById("totalProducts").textContent = totalProducts;
                document.getElementById("totalStock").textContent = totalStock;
                document.getElementById("lowStock").textContent = lowStock;
                document.getElementById("outOfStock").textContent = outOfStock;

                const productsDiv = document.getElementById('products');
                const selectedCategory =
                    document.getElementById("categoryFilter").value;

                const selectedSort =
                    document.getElementById("sortBy").value;

                const categoryFilter = document.getElementById("categoryFilter");

                categoryFilter.innerHTML = '<option value="all">All Categories</option>';

                categories.forEach(category => {
                    categoryFilter.innerHTML += `
                 <option value="${category}">${category}</option>
    `;
                });
                categoryFilter.value = selectedCategory;

                document.getElementById("sortBy").value = selectedSort;

                if (products.length === 0) {
                    productsDiv.innerHTML =
                        '<div class="empty">No products found.</div>';
                    return;
                }

                let html = '';

                products.forEach(product => {
                    let stockStatus = "";

                    if (product.quantity === 0) {
                        stockStatus = "🔴 Out of Stock";
                    } else if (product.quantity <= 5) {
                        stockStatus = "🟠 Low Stock";
                    } else {
                        stockStatus = "🟢 In Stock";
                    }

                    html += `
                        <div class="product-card" data-category="${product.category || ''}">


${product.imageName
                        ? `<img src="/uploads/${product.imageName}"
       alt="${product.name}">`
                        : ""}

<h3>${product.name}</h3>

                            <p>
                                <strong>Description:</strong>
                                ${product.description}
                            </p>
                           <p>
                            <strong>Category:</strong>
                            <span class="category-badge">
                                ${product.category ? product.category : "Not specified"}
                            </span>
                        </p>


                            <p class="price">
                               Price: ₹${Number(product.price).toLocaleString("en-IN", {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}
                            </p>

                            <p class="quantity">
                                Quantity: ${product.quantity}
                            </p>
                            <p class="stock-status">${stockStatus}</p>

                            <div class="actions">

                                <button class="edit-btn"
                                        onclick="editProduct(${product.id})">
                                    Edit
                                </button>

                                <button class="delete-btn"
                                        onclick="deleteProduct(${product.id})">
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;
                });

                displayPage();
            })
            .catch(error => {

                document.getElementById('products').innerHTML =
                    '<div class="empty">Unable to load products.</div>';

                console.error(error);
            });
    }

    function displayPage() {

        const productsDiv = document.getElementById("products");

        const start =
            (currentPage - 1) * productsPerPage;

        const end =
            start + productsPerPage;

        const productsToShow =
            filteredProducts.slice(start, end);

        if (filteredProducts.length === 0) {
            productsDiv.innerHTML =
                '<div class="empty">No products found.</div>';

            document.getElementById("pageInfo").textContent =
                "No pages";

            document.getElementById("prevPage").disabled = true;
            document.getElementById("nextPage").disabled = true;

            return;
        }

        let html = "";

        productsToShow.forEach(product => {

            let stockStatus = "";

            if (product.quantity === 0) {
                stockStatus = '<span class="stock-status stock-out">🔴 Out of Stock</span>';
            } else if (product.quantity <= 5) {
                stockStatus = '<span class="stock-status stock-low">🟠 Low Stock</span>';
            } else {
                stockStatus = '<span class="stock-status stock-in">🟢 In Stock</span>';
            }

            html += `
            <div class="product-card"
                 data-category="${product.category || ''}">


${product.imageName
                ? `<img src="/uploads/${product.imageName}"
            alt="${product.name}"
            style="width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px;">`
                : ""}
<h3>${product.name}</h3>


                <p>
                    <strong>Description:</strong>
                    ${product.description}
                </p>

                <p>
                    <strong>Category:</strong>
                    ${product.category ? product.category : "Not specified"}
                </p>

                <p class="price">
                      Price: ₹${Number(product.price).toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            })}
                </p>

                <p class="quantity">
                    Quantity: ${product.quantity}
                </p>

                <p class="stock-status">
                    ${stockStatus}
                </p>

                <div class="actions">

                    <button class="edit-btn"
                            onclick="editProduct(${product.id})">
                        Edit
                    </button>

                    <button class="delete-btn"
                            onclick="deleteProduct(${product.id})">
                        Delete
                    </button>

                </div>

            </div>
        `;
        });

        productsDiv.innerHTML = html;
        const totalPages =
            Math.ceil(filteredProducts.length / productsPerPage);

        document.getElementById("pageInfo").textContent =
            `Page ${currentPage} of ${totalPages}`;

        document.getElementById("prevPage").disabled =
            currentPage === 1;

        document.getElementById("nextPage").disabled =
            currentPage === totalPages;
    }

    function nextPage() {

        const totalPages =
            Math.ceil(filteredProducts.length / productsPerPage);

        if (currentPage < totalPages) {
            currentPage++;
            displayPage();
        }
    }

    function previousPage() {

        if (currentPage > 1) {
            currentPage--;
            displayPage();
        }
    }

    function showAddForm() {

        // Clear search and category filter
        document.getElementById("searchInput").value = "";
        document.getElementById("categoryFilter").value = "all";

        // Reset product list
        filteredProducts = allProducts;
        currentPage = 1;
        displayPage();

        // Clear Add Product form
        document.getElementById("name").value = "";
        document.getElementById("description").value = "";
        document.getElementById("productCategory").value = "";
        document.getElementById("price").value = "";
        document.getElementById("quantity").value = "";

        // Show form
        document.getElementById("productForm").style.display = "block";
    }

    function hideAddForm() {

        const name = document.getElementById("name").value.trim();
        const description = document.getElementById("description").value.trim();
        const category = document.getElementById("productCategory").value.trim();
        const price = document.getElementById("price").value.trim();
        const quantity = document.getElementById("quantity").value.trim();

        const hasData =
            name !== "" ||
            description !== "" ||
            category !== "" ||
            price !== "" ||
            quantity !== "";

        if (hasData) {
            const confirmCancel =
                confirm("Are you sure you want to cancel? Your entered data will be lost.");

            if (!confirmCancel) {
                return;
            }
        }

        document.getElementById("productForm").style.display = "none";
    }


    async function saveProduct() {
        const name = document.getElementById("name").value.trim();
        const description = document.getElementById("description").value.trim();
        const category = document.getElementById("productCategory").value.trim();
        const price = Number(document.getElementById("price").value);
        const quantity = Number(document.getElementById("quantity").value);

        if (name === "") {
            alert("Please enter a product name.");
            return;
        }

        if (description === "") {
            alert("Please enter a description.");
            return;
        }

        if (category === "") {
            alert("Please enter a category.");
            return;
        }

        if (price <= 0) {
            alert("Price must be greater than 0.");
            return;
        }

        if (quantity < 0) {
            alert("Quantity cannot be negative.");
            return;
        }

        const product = {
            name: name,
            description: description,
            category: category,
            price: price,
            quantity: quantity
        };

        try {
            const response = await fetch("/api/products", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            if (!response.ok) {
                throw new Error("Failed to save product");
            }

            const data = await response.json();

            const imageInput = document.getElementById("productImage");
            const imageFile = imageInput.files[0];

            if (imageFile) {
                const formData = new FormData();
                formData.append("image", imageFile);

                const imageResponse = await fetch(
                    `/api/products/${data.id}/image`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                if (!imageResponse.ok) {
                    throw new Error(
                        "Product saved, but image upload failed"
                    );
                }
            }

            alert("Product saved successfully!");

            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
            document.getElementById("productCategory").value = "";
            document.getElementById("price").value = "";
            document.getElementById("quantity").value = "";
            document.getElementById("productImage").value = "";

            hideAddForm();
            loadProducts();

        } catch (error) {
            console.error(error);
            alert(error.message || "Error saving product.");
        }
    }



    async function editProduct(id) {

        const response = await fetch(`/api/products/${id}`);

        if (!response.ok) {
            alert("Product not found!");
            return;
        }

        const product = await response.json();

        document.getElementById("editId").value = product.id;
        document.getElementById("editName").value = product.name;
        document.getElementById("editDescription").value = product.description;
        document.getElementById("editCategory").value = product.category;
        document.getElementById("editPrice").value = product.price;
        document.getElementById("editQuantity").value = product.quantity;
        document.getElementById("editProductImage").value = "";

        document.getElementById("editModal").style.display = "block";
    }


    function deleteProduct(id) {

        if (!confirm("Are you sure you want to delete this product?")) {
            return;
        }

        fetch('/api/products/' + id, {
            method: 'DELETE'
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error("Delete failed. Status: " + response.status);
                }

                if (response.status === 204) {
                    alert("Product deleted successfully!");
                    loadProducts();
                }
            })
            .catch(error => {

                console.error(error);

                alert("Error deleting product.");
            });
    }


    loadProducts();
    function applyFilters() {

        const searchText =
            document.getElementById("searchInput").value.toLowerCase();

        const selectedCategory =
            document.getElementById("categoryFilter").value;

        filteredProducts = allProducts.filter(product => {

            const matchesSearch =
                product.name.toLowerCase().includes(searchText);

            const matchesCategory =
                selectedCategory === "all" ||
                product.category === selectedCategory;

            return matchesSearch && matchesCategory;
        });

        currentPage = 1;

        displayPage();
    }

    function searchProducts() {
        applyFilters();
    }

    function filterByCategory() {
        applyFilters();
    }
    function sortProducts() {

        const sortBy =
            document.getElementById("sortBy").value;

        filteredProducts.sort((a, b) => {

            if (sortBy === "default") {
                return a.id - b.id;
            }

            if (sortBy === "nameAsc") {
                return a.name.localeCompare(b.name);
            }

            if (sortBy === "nameDesc") {
                return b.name.localeCompare(a.name);
            }

            if (sortBy === "priceAsc") {
                return a.price - b.price;
            }

            if (sortBy === "priceDesc") {
                return b.price - a.price;
            }

            if (sortBy === "quantityAsc") {
                return a.quantity - b.quantity;
            }

            if (sortBy === "quantityDesc") {
                return b.quantity - a.quantity;
            }
        });

        currentPage = 1;

        displayPage();
    }

    async function updateProduct() {

        const name = document.getElementById("editName").value.trim();
        const description = document.getElementById("editDescription").value.trim();
        const category = document.getElementById("editCategory").value.trim();

        const priceValue = document.getElementById("editPrice").value.trim();
        const quantityValue = document.getElementById("editQuantity").value.trim();

        // Check empty fields
        if (name === "") {
            alert("Please enter a product name.");
            return;
        }

        if (description === "") {
            alert("Please enter a description.");
            return;
        }

        if (category === "") {
            alert("Please enter a category.");
            return;
        }

        if (priceValue === "") {
            alert("Please enter a price.");
            return;
        }

        if (quantityValue === "") {
            alert("Please enter a quantity.");
            return;
        }

        // Convert values to numbers
        const price = Number(priceValue);
        const quantity = Number(quantityValue);

        // Check invalid numbers
        if (price <= 0) {
            alert("Price must be greater than 0.");
            return;
        }

        if (quantity < 0) {
            alert("Quantity cannot be negative.");
            return;
        }

        const id = document.getElementById("editId").value;

        const updatedProduct = {
            name: name,
            description: description,
            category: category,
            price: price,
            quantity: quantity
        };

        const response = await fetch(`/api/products/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updatedProduct)
        });


        if (response.ok) {
            const imageInput = document.getElementById("editProductImage");
            const imageFile = imageInput.files[0];

            if (imageFile) {
                const formData = new FormData();
                formData.append("image", imageFile);

                const imageResponse = await fetch(`/api/products/${id}/image`, {
                    method: "POST",
                    body: formData
                });

                if (!imageResponse.ok) {
                    alert("Product details updated, but image upload failed.");
                    return;
                }
            }

            alert("Product updated successfully!");
            closeEditModal();
            loadProducts();
        } else {
            alert("Failed to update product!");
        }

    }

    function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
    }


    async function logout() {
        const response = await fetch("/api/auth/logout", {
            method: "POST"
        });

        if (response.ok) {
            window.location.href = "/login.html";
        } else {
            alert("Logout failed. Please try again.");
        }
    }

    function cancelEdit() {

        const confirmCancel =
            confirm("Are you sure you want to cancel? Your changes will be lost.");

        if (!confirmCancel) {
            return;
        }

        closeEditModal();
    }

</script>

</body>
</html>
